# Mirror of spineworkspace-live/config/public-sites.yaml (keep in sync until shared package).
# Trace: SPINE-OPS · public marketing routes

version: 1

flags:
  innovlabs_canonical_live:
    default: false
    from_env:
      CANONICAL_REDIRECTS_ENABLED: ["true", "1", "yes"]
      SPINE_INNOVLABS_CANONICAL_LIVE: ["true", "1", "yes"]

environments:
  prod:
    spine_innovlabs:
      public_url: https://spineinnovtech.com
      canonical_url: https://spineinnovtech.com
      legacy_redirect_hosts:
        - www.spineinnovtech.com
        - spineinnovtech.spineworkspace.com
        - spineinnovlabs.spineworkspace.com
        - www.spineinnovlabs.com
        - spineinnovlabs.com
    spine_workspace:
      apex: https://spineworkspace.com
      app: https://app.spineworkspace.com
      auth: https://auth.spineworkspace.com
      domain_root: spineworkspace.com

  test:
    spine_innovlabs:
      public_url: https://test.spineinnovtech.com
      canonical_url: https://spineinnovtech.com
    spine_workspace:
      apex: https://spineworkspace.com
      app: https://app.spineworkspace.com
      auth: https://auth.spineworkspace.com
      domain_root: spineworkspace.com

  dev:
    spine_innovlabs:
      public_url: https://dev.spineinnovtech.com
      canonical_url: https://spineinnovtech.com
    spine_workspace:
      apex: https://spineworkspace.com
      app: https://app.spineworkspace.com
      auth: https://auth.spineworkspace.com
      domain_root: spineworkspace.com

url_rules:
  spine_innovlabs_site:
    - if: { env: prod, innovlabs_canonical_live: true }
      then_ref: environments.prod.spine_innovlabs.canonical_url
    - if: { env: prod, innovlabs_canonical_live: false }
      then_ref: environments.prod.spine_innovlabs.public_url
    - if: { env: test }
      then_ref: environments.test.spine_innovlabs.public_url
    - if: { env: dev }
      then_ref: environments.dev.spine_innovlabs.public_url
    - else_ref: environments.prod.spine_innovlabs.public_url

  spine_workspace_apex:
    - if: { env: [prod, test, dev] }
      then_ref: environments.${env}.spine_workspace.apex
    - else_ref: environments.prod.spine_workspace.apex

  spine_workspace_app:
    - if: { env: [prod, test, dev] }
      then_ref: environments.${env}.spine_workspace.app
    - else_ref: environments.prod.spine_workspace.app

  spine_workspace_auth:
    - if: { env: [prod, test, dev] }
      then_ref: environments.${env}.spine_workspace.auth
    - else_ref: environments.prod.spine_workspace.auth

navigation:
  innovlabs_product_cta: spine_workspace.apex
  workspace_footer_parent: spine_innovlabs_site

build:
  prod_site_url: https://spineinnovtech.com
