# Manual fallback QA only; Cloudflare Workers Builds owns production deployment.
# Keeping this opt-in avoids duplicate automatic GitHub builds.
name: Manual marketing QA

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_PUBLIC_SITE_URL: https://spineinnovtech.com

jobs:
  build:
    name: Static release verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Repository preflight
        run: npm run lint

      - name: Audit corporate routes and claims
        run: npm run audit:site

      - name: Validate Cloudflare deployment contract
        run: npm run check:cloudflare

      - name: TypeScript check
        run: npm run typecheck

      - name: Static export
        run: npm run build

      - name: Verify corporate artifact
        run: npm run verify:artifact
